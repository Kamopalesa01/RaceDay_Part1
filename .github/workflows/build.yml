name: Build and Test RaceDay API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore "RaceDay/RaceDay.slnx"

    - name: Build
      run: dotnet build "RaceDay/RaceDay.slnx" --no-restore

    - name: Test
      run: dotnet test "RaceDay/RaceDay.slnx" --no-build --verbosity normal
